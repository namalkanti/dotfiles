# NVIDIA proprietary driver + picom is prone to tearing under xrender's
# default sync behavior. xrender-sync-fence is the standard fix (Arch wiki:
# picom > Screen tearing) for this combination.
backend = "xrender";
vsync = true;
xrender-sync-fence = true;

# Drop shadow on the focused window only, to make it stand out without
# relying solely on the border color.
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.65;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [
    "! focused",
    "override_redirect = true"
];
